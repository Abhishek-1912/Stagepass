name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stagepass-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Report failed tests
        if: failure()
        run: |
          for f in target/surefire-reports/TEST-*.xml; do
            if grep -q -E 'failures="[1-9]|errors="[1-9]' "$f"; then
              msg=$(grep -o -m1 -E '(failure|error) message="[^"]{0,500}' "$f" | head -1)
              echo "::error title=Failed test $(basename "$f" .xml)::$msg"
            fi
          done

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stagepass-web
    env:
      VITE_API_BASE_URL: https://api.example.invalid
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: stagepass-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - run: npm run check:bundle
      - name: Playwright smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: stagepass-web/test-results/
          retention-days: 7
