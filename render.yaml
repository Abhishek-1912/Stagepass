# Render Blueprint for Stagepass (API in Singapore; the static site is served from Render's global CDN). Secrets use `sync: false`:
# Render asks for their values when the blueprint is first applied; they are never stored in git.
services:
  - type: web
    name: stagepass-api
    runtime: docker
    region: singapore
    plan: free # testing without Razorpay; switch to starter before payments go live (free instances sleep when idle, delaying webhooks)
    rootDir: stagepass-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
      - key: QR_SECRET
        generateValue: true
      - key: PAYOUT_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: COMPANY_GSTIN
        sync: false
      - key: COMPANY_STATE
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_EMAIL
        sync: false
      - key: COMPANY_PHONE
        sync: false

  - type: web
    name: stagepass-web
    runtime: static
    rootDir: stagepass-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(self)
      # Report-only at launch (Plan 10 ruling); enforce in Plan 11 once real traffic shows no violations.
      # The sha256 is the inline theme script in index.html - update it if that script changes.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' https://checkout.razorpay.com 'sha256-y2vHlymdvbnX3xnU9AA2EK1iwC37JCRpUw+i1S4kjpk='; connect-src 'self' https://*.onrender.com https://*.supabase.co wss://*.supabase.co https://api.cloudinary.com https://*.razorpay.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.googleusercontent.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://www.google.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:"
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_KEY
        sync: false
