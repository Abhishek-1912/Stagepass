# Render Blueprint for Stagepass (Singapore region). Secrets use `sync: false`:
# Render asks for their values when the blueprint is first applied; they are never stored in git.
services:
  - type: web
    name: stagepass-api
    runtime: docker
    region: singapore
    plan: starter # free instances sleep, which would delay Razorpay webhooks
    rootDir: stagepass-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
      - key: QR_SECRET
        generateValue: true
      - key: PAYOUT_ENCRYPTION_KEY
        sync: false

  - type: web
    name: stagepass-web
    runtime: static
    region: singapore
    rootDir: stagepass-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
