logging.structured.format.console=ecs
# Tomcat's RemoteIpValve reads X-Forwarded-For from the right, skipping private-range proxies, so the client
# address can't be spoofed by a header the client sends (the rate limiter keys on it).
server.forward-headers-strategy=native
management.endpoint.health.show-details=never
# Supabase pooler (session mode): keep the pool small (spec 13).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1700000
