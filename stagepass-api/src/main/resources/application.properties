spring.application.name=stagepass-api
spring.profiles.default=dev
# Render (and most PaaS) inject PORT
server.port=${PORT:8080}

# Database (Supabase Postgres via pooler, session mode)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.fail-on-missing-locations=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Supabase Auth
supabase.url=${SUPABASE_URL}
supabase.jwks-uri=${SUPABASE_JWKS_URI:${SUPABASE_URL}/auth/v1/.well-known/jwks.json}
supabase.issuer=${SUPABASE_ISSUER:${SUPABASE_URL}/auth/v1}
supabase.audience=authenticated

# Stagepass
stagepass.web-base-url=${WEB_BASE_URL}
stagepass.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${WEB_BASE_URL}}
stagepass.bootstrap.admin-emails=${BOOTSTRAP_ADMIN_EMAILS:}
stagepass.hold-minutes=10
stagepass.qr-secret=${QR_SECRET}
stagepass.payout-encryption-key=${PAYOUT_ENCRYPTION_KEY}
stagepass.payout.hold-days=3
