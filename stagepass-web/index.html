<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6C4CF1" />
    <meta name="description" content="Stagepass — discover and book concerts, comedy, tech, food and festival events across India." />
    <title>Stagepass — Discover events and book tickets</title>
    <script>
      // Apply saved theme before first paint to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem('stagepass-theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
